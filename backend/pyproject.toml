[project]
name = "i2c-backend"
version = "0.1.0"
description = "Inventory → Image → Catalog backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt<4.1",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.9",
  "pillow>=10.3",
  "httpx>=0.27",
  "psycopg2-binary>=2.9",
  "qrcode>=7.4",
  "python-slugify>=8.0",
  "slowapi>=0.1.9",
  "structlog>=24.1",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "aiosqlite"]
local-ai = ["rembg>=2.0", "onnxruntime>=1.18"]

[tool.ruff]
extend-exclude = ["alembic/versions"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B024", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
